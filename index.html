      color: var(--fg);

      font-family: Arial, sans-serif;
    }

    }

    .webring {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 100;
      opacity: 1;
      pointer-events: auto;
    }

    .webring a {
      color: inherit;
      cursor: pointer;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: auto hidden;
      scroll-behavior: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .viewport::-webkit-scrollbar {
      display: none;
    }

    .world {
      position: relative;
      min-width: 100vw;
      height: 100vh;
      overflow: visible;
    }

    .bg-pattern {
      position: absolute;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-panel {
      position: absolute;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      opacity: var(--bg-opacity);
    }

    .stack {
      position: absolute;
      left: var(--start-offset-x);
      bottom: 3vh;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: var(--stack-gap);
      padding: 0 20vw;
      z-index: 1;
      transform-origin: left bottom;
      transition: transform 260ms ease;
      will-change: transform;
      overflow: visible;
    }

    body.overview-mode .stack {
      transform: scale(var(--overview-scale));
    }

    .tile {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex: 0 0 auto;
      pointer-events: none;
      transform-origin: center bottom;
      animation: pop 180ms ease-out;
      will-change: transform, opacity;
      line-height: 0;
      position: relative;
      z-index: 2;
      contain: layout style;
      overflow: visible;
    }

    .tile img {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: center bottom;
      image-rendering: auto;
      overflow: visible;
    }

    .tile.scatter {
      position: absolute;
      left: 0;
      top: 0;
      bottom: auto;
      z-index: 3;
      overflow: visible;
    }

      min-height: 84px;
      padding: 14px;

      border-radius: 16px;

    }

      left: 24px;
      right: 24px;
      pointer-events: none;
    }

      z-index: 10;
    }

      word-break: keep-all;

      min-height: 1em;

      word-break: keep-all;

    }

    .hidden-input {
      position: fixed;
      left: -9999px;
      top: 0;
      opacity: 0;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateX(14px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

      transform-origin: center bottom;

    }

      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    function buildShuffledBackgrounds(images) {
      if (images.length <= 1) return [...images];

      if (previousFirst && shuffled[0] === previousFirst) {
        const swapIndex =

        [shuffled[0], shuffled[swapIndex]] =
          [shuffled[swapIndex], shuffled[0]];
      }

      sessionStorage.setItem(PREVIOUS_BG_FIRST_KEY, shuffled[0]);

      return shuffled;

    }

    async function loadImageAsset(src) {
      if (imageCache.has(src)) {
        return imageCache.get(src).cloneNode();
      }

      const img = new Image();
      img.decoding = "async";
      img.src = src;

      try {
        if (img.decode) {
          await img.decode();
        } else {
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
          });
        }
      } catch (_) {
        await new Promise(resolve => {
          if (img.complete) {
            resolve();
            return;
          }

          img.onload = () => resolve();
          img.onerror = () => resolve();
        });
      }

      imageCache.set(src, img);

      return img.cloneNode();
    }

    async function loadAudioBuffer(src) {
      if (audioBufferCache.has(src)) {
        return audioBufferCache.get(src);
      }

      const ctx = await resumeAudioContextIfNeeded();
      const response = await fetch(src);

      if (!response.ok) {
        throw new Error(`Failed to fetch audio: ${src}`);
      }

      const arrayBuffer = await response.arrayBuffer();
      const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

      audioBufferCache.set(src, audioBuffer);

      return audioBuffer;
    }

    function preloadAssets() {
      Object.values(jamoImages).forEach(src => {
        loadImageAsset(src).catch(() => {});
      });

      randomizedBackgroundImages.forEach(src => {
        const img = new Image();
        img.decoding = "async";
        img.src = src;
      });

      Object.values(englishKeySounds).forEach(src => {
        loadAudioBuffer(src).catch(() => {});
      });
    }

    function animateCamera(timestamp) {
      if (!cameraStartTime) {
        cameraStartTime = timestamp;
      }

      const elapsed = timestamp - cameraStartTime;
      const t = Math.min(1, elapsed / CAMERA_DURATION);
      const eased = easeOutCubic(t);

      cameraCurrentX =
        cameraStartX + (cameraTargetX - cameraStartX) * eased;

      viewport.scrollLeft = cameraCurrentX;

      if (t >= 1) {
        cameraCurrentX = cameraTargetX;
        viewport.scrollLeft = cameraCurrentX;
        cameraAnimationFrame = null;
        cameraStartTime = 0;
        return;
      }

      cameraAnimationFrame = requestAnimationFrame(animateCamera);
    }

    function moveCameraTo(targetX, immediate = false) {
      const maxScroll = Math.max(
        0,
        world.scrollWidth - viewport.clientWidth
      );

      const clampedX = Math.max(0, Math.min(targetX, maxScroll));

      if (immediate) {
        if (cameraAnimationFrame) {
          cancelAnimationFrame(cameraAnimationFrame);
          cameraAnimationFrame = null;
        }

        cameraStartTime = 0;
        cameraCurrentX = clampedX;
        cameraStartX = clampedX;
        cameraTargetX = clampedX;
        viewport.scrollLeft = clampedX;

        return;
      }

      cameraStartX = viewport.scrollLeft;
      cameraCurrentX = viewport.scrollLeft;
      cameraTargetX = clampedX;
      cameraStartTime = 0;

      if (cameraAnimationFrame) {
        cancelAnimationFrame(cameraAnimationFrame);
      }

      cameraAnimationFrame = requestAnimationFrame(animateCamera);
    }

    /* 웹링 클릭 시에는 입력창에 포커스하지 않음 */
    document.addEventListener("click", async event => {
      if (event.target.closest(".webring")) return;

      focusInput();
      await unlockAudio();
    });

    window.addEventListener("load", () => {
      focusInput();

      cameraCurrentX = viewport.scrollLeft;
      cameraStartX = viewport.scrollLeft;
      cameraTargetX = viewport.scrollLeft;

      preloadAssets();
    });

    function playAudioBySrc(src, volume = 1) {
      if (!audioUnlocked || !src) return;

      const audio = new Audio(src);

      audio.volume = Math.max(0, Math.min(volume, 1));
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    async function playBoostedAudioBySrc(src, gainValue = 1) {
      if (!audioUnlocked || !src) return;

      try {
        const ctx = await resumeAudioContextIfNeeded();
        const audioBuffer = await loadAudioBuffer(src);

        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;

        const gainNode = ctx.createGain();
        gainNode.gain.value = gainValue;

        source.connect(gainNode);
        gainNode.connect(ctx.destination);
        source.start(0);
      } catch (_) {}
    }

    function playJamoSound(jamo) {
      playAudioBySrc(jamoSounds[jamo], 1);
    }

    function playFollowKeySound(jamo) {
      if (!audioUnlocked) return;

      const keySequence = jamoToEnglishKey[jamo];

      if (!keySequence) return;

      const timeoutId = setTimeout(() => {
        [...keySequence].forEach((keyChar, index) => {
          const keySrc = englishKeySounds[keyChar];

          if (!keySrc) return;

          setTimeout(() => {
            playBoostedAudioBySrc(keySrc, FOLLOW_KEY_GAIN);
          }, index * FOLLOW_KEY_STEP_DELAY);
        });

        followSoundTimeouts.delete(timeoutId);
      }, FOLLOW_KEY_DELAY);

      followSoundTimeouts.add(timeoutId);
    }

    function clearFollowKeyTimeouts() {
      followSoundTimeouts.forEach(id => clearTimeout(id));
      followSoundTimeouts.clear();
    }

    function isHangulSyllable(char) {
      const code = char.charCodeAt(0);
      return code >= 0xAC00 && code <= 0xD7A3;
    }

    function isCompatibilityJamo(char) {
      const code = char.charCodeAt(0);
      return code >= 0x3131 && code <= 0x318E;
    }

    function decomposeHangul(char) {
      if (isCompatibilityJamo(char)) {
        return [char];
      }

      if (!isHangulSyllable(char)) {
        return [];
      }

      const code = char.charCodeAt(0) - 0xAC00;
      const cho = Math.floor(code / (21 * 28));
      const jung = Math.floor((code % (21 * 28)) / 28);
      const jong = code % 28;

      const result = [
        CHOSEONG[cho],
        JUNGSEONG[jung]
      ];

      if (jong !== 0) {
        const jongChar = JONGSEONG[jong];

        if (COMPLEX_JONG_MAP[jongChar]) {
          result.push(...COMPLEX_JONG_MAP[jongChar]);
        } else {
          result.push(jongChar);
        }
      }

      return result;
    }

    function getCurrentScale() {
      return overviewMode ? getOverviewScale() : 1;
    }

    function ensureBackgroundTrack() {
      const panelWidth = getViewportWidth();
      const neededCount = getRequiredBackgroundPanelCount();

      if (
        neededCount === backgroundPanelCount &&
        bgPattern.childElementCount
      ) {
        bgPattern.style.width = `${panelWidth * neededCount}px`;
        bgPattern.style.height = "100vh";

        [...bgPattern.children].forEach((panel, i) => {
          panel.style.left = `${i * panelWidth}px`;
          panel.style.width = `${panelWidth}px`;
        });

        return;
      }

      bgPattern.innerHTML = "";
      bgPattern.style.width = `${panelWidth * neededCount}px`;
      bgPattern.style.height = "100vh";

      for (let i = 0; i < neededCount; i++) {
        const panel = document.createElement("div");

        panel.className = "bg-panel";
        panel.style.left = `${i * panelWidth}px`;
        panel.style.width = `${panelWidth}px`;

        const background =
          randomizedBackgroundImages[
            i % randomizedBackgroundImages.length
          ];

        panel.style.backgroundImage = `url("${background}")`;

        bgPattern.appendChild(panel);
      }

      backgroundPanelCount = neededCount;
    }

    function updateWorldSize() {
      const scale = getCurrentScale();
      const viewportWidth = getViewportWidth();

      const stackWidth =
        stack.offsetWidth * scale + viewportWidth * 0.45;

      const backgroundTrackWidth =
        getRequiredBackgroundPanelCount() * viewportWidth;

      const neededWidth = Math.max(
        viewportWidth,
        backgroundTrackWidth,
        stackWidth
      );

      world.style.width = `${neededWidth}px`;
      world.style.height = `${window.innerHeight}px`;
      bgPattern.style.width = `${neededWidth}px`;
    }

    function lockViewToTile(tile, smooth = false) {
      if (!tile) return;

      const viewportRect = viewport.getBoundingClientRect();
      const tileRect = tile.getBoundingClientRect();
      const currentScrollLeft = viewport.scrollLeft;

      const anchorX =
        viewport.clientWidth * getCameraAnchorX();

      const tileAnchor =
        tileRect.left -
        viewportRect.left +
        currentScrollLeft +
        tileRect.width * 0.55;

      const targetScrollLeft = tileAnchor - anchorX;

      moveCameraTo(targetScrollLeft, !smooth);
    }

    function getLastTile() {
      return placedTiles[placedTiles.length - 1] || null;
    }

    function toggleOverviewMode() {
      const lastTile = getLastTile();

      overviewMode = !overviewMode;

      document.body.classList.toggle(
        "overview-mode",
        overviewMode
      );

      updateWorldSize();
      ensureBackgroundTrack();

      if (!lastTile) return;

      requestAnimationFrame(() => {
        lockViewToTile(lastTile, false);
      });

      const onEnd = event => {
        if (event.propertyName !== "transform") return;
        if (event.target !== stack) return;

        stack.removeEventListener("transitionend", onEnd);

        updateWorldSize();
        ensureBackgroundTrack();
        lockViewToTile(lastTile, false);
      };

      stack.addEventListener("transitionend", onEnd);
    }

    function placeScatterTile(tile, imgOrFallback) {
      const stackRect = stack.getBoundingClientRect();

      const minXRatio = getScatterScreenXMin();
      const maxXRatio = getScatterScreenXMax();
      const minYRatio = getScatterScreenYMin();
      const maxYRatio = getScatterScreenYMax();

      const randomViewportX =
        viewport.scrollLeft +
        viewport.clientWidth *
        (Math.random() * (maxXRatio - minXRatio) + minXRatio);

      const randomViewportY =
        viewport.clientHeight *
        (Math.random() * (maxYRatio - minYRatio) + minYRatio);

      const localLeft =
        randomViewportX -
        stack.offsetLeft -
        imgOrFallback.offsetWidth * 0.5;

      const localTop =
        randomViewportY -
        stackRect.top -
        imgOrFallback.offsetHeight * 0.5;

      tile.style.left = `${localLeft}px`;
      tile.style.top = `${localTop}px`;
      tile.style.bottom = "auto";

      imgOrFallback.style.transform = "none";
    }

    function applyTileMetrics(tile, jamo, img) {
      const globalScale = getGlobalScale();

      img.style.width = `${img.naturalWidth * globalScale}px`;
      img.style.height = `${img.naturalHeight * globalScale}px`;

      tile.style.margin = "0px";
      tile.style.zIndex = scatterJamos.has(jamo) ? "3" : "2";

      if (scatterJamos.has(jamo)) {
        tile.classList.add("scatter");
        placeScatterTile(tile, img);
      } else {
        tile.classList.remove("scatter");
        tile.style.left = "";
        tile.style.top = "";
        tile.style.bottom = "";
        img.style.transform = "none";
      }
    }

    function applyFallbackMetrics(tile, jamo, fallback) {
      tile.style.margin = "0px";
      tile.style.zIndex = scatterJamos.has(jamo) ? "3" : "2";

      if (scatterJamos.has(jamo)) {
        tile.classList.add("scatter");
        placeScatterTile(tile, fallback);
      } else {
        tile.classList.remove("scatter");
        tile.style.left = "";
        tile.style.top = "";
        tile.style.bottom = "";
        fallback.style.transform = "none";
      }
    }

    function setStrongRandomTilt(img, jamo) {
      if (!img) return;

      if (!elasticJamos.has(jamo)) {
        img.style.setProperty("--tilt", "0deg");
        img.style.setProperty("--rest-tilt", "0deg");
        return;
      }

      const angle = (-70 + Math.random() * 100).toFixed(2);

      img.style.setProperty("--tilt", `${angle}deg`);
      img.style.setProperty("--rest-tilt", `${angle}deg`);
      img.style.transformOrigin = "center bottom";
      img.style.transform = `rotate(${angle}deg)`;
    }

    function applyElasticAnimation(img, jamo) {
      if (!img || !elasticJamos.has(jamo)) return;

      const horizontalBias = Math.random() > 0.45;

      let stretchX;
      let stretchY;

      if (horizontalBias) {
        stretchX = (4.2 + Math.random() * 3.0).toFixed(3);
        stretchY = (0.04 + Math.random() * 0.22).toFixed(3);
      } else {
        stretchX = (0.35 + Math.random() * 0.28).toFixed(3);
        stretchY = (4.0 + Math.random() * 4.6).toFixed(3);
      }

      img.style.setProperty("--stretch-x", stretchX);
      img.style.setProperty("--stretch-y", stretchY);
      img.style.transformOrigin = "center bottom";
      img.style.overflow = "visible";

      img.classList.remove("elastic-enter");
      void img.offsetWidth;
      img.classList.add("elastic-enter");

      const clearElastic = () => {
        img.classList.remove("elastic-enter");
        img.style.removeProperty("--stretch-x");
        img.style.removeProperty("--stretch-y");
        img.style.removeProperty("overflow");

        img.removeEventListener("animationend", clearElastic);

        if (elasticJamos.has(jamo)) {
          const restTilt =
            img.style.getPropertyValue("--rest-tilt").trim() ||
            "0deg";

          img.style.transform = `rotate(${restTilt})`;
        } else {
          img.style.transform = "none";
        }
      };

      img.addEventListener(
        "animationend",
        clearElastic,
        { once: true }
      );
    }

    async function createTile(jamo) {
      const tile = document.createElement("div");

      tile.className = "tile";
      tile.dataset.jamo = jamo;

      const src = jamoImages[jamo];

      placedTiles.push(tile);

      if (src) {
        const img = await loadImageAsset(src);

        img.alt = jamo;
        tile.appendChild(img);
        stack.appendChild(tile);

        applyTileMetrics(tile, jamo, img);
        setStrongRandomTilt(img, jamo);
        applyElasticAnimation(img, jamo);

        updateWorldSize();
        ensureBackgroundTrack();

        if (!scatterJamos.has(jamo)) {
          lockViewToTile(tile, true);
        }
      } else {
        const fallback = document.createElement("div");

        fallback.className = "fallback";
        fallback.textContent = jamo;

        tile.appendChild(fallback);
        stack.appendChild(tile);

        applyFallbackMetrics(tile, jamo, fallback);

        updateWorldSize();
        ensureBackgroundTrack();

        if (!scatterJamos.has(jamo)) {
          lockViewToTile(tile, true);
        }
      }

      playJamoSound(jamo);
      playFollowKeySound(jamo);
    }

    function addCharacter(char) {
      const jamos = decomposeHangul(char);

      if (!jamos.length) return;

      const englishKeys = jamosToEnglishKeys(jamos);

      typedHistory.push({
        char,
        jamos,
        englishKeys,
        tileCount: jamos.length
      });

      composedText += char;
      composedEnglishText += englishKeys;

      updateTypedOverlay();
      updateEnglishTypedOverlay();

      jamos.forEach(jamo => {
        createTile(jamo);
      });
    }

    function removeLastTile() {
      const lastEntry = typedHistory.pop();

      if (!lastEntry) return;

      for (let i = 0; i < lastEntry.tileCount; i++) {
        const lastTile = placedTiles.pop();

        if (lastTile) {
          lastTile.remove();
        }
      }

      if (lastEntry.char === "\n") {
        composedText = composedText.slice(0, -1);
        composedEnglishText = composedEnglishText.slice(0, -1);
      } else {
        composedText =
          composedText.slice(0, -lastEntry.char.length);

        composedEnglishText =
          composedEnglishText.slice(
            0,
            -lastEntry.englishKeys.length
          );
      }

      updateTypedOverlay();
      updateEnglishTypedOverlay();
      updateWorldSize();
      ensureBackgroundTrack();

      const newLast = [...placedTiles]
        .reverse()
        .find(tile => !tile.classList.contains("scatter"));

      if (newLast) {
        requestAnimationFrame(() => {
          lockViewToTile(newLast, false);
        });
      }
    }

    function clearAllTiles() {
      placedTiles.splice(0).forEach(element => {
        element.remove();
      });

      typedHistory.splice(0);
      clearFollowKeyTimeouts();

      composedText = "";
      composedEnglishText = "";

      updateTypedOverlay();
      updateEnglishTypedOverlay();
      updateWorldSize();
      ensureBackgroundTrack();

      moveCameraTo(0, true);
    }

    let previousValue = "";

    imeInput.addEventListener("input", () => {
      const currentValue = imeInput.value;

      if (!currentValue) {
        previousValue = "";
        return;
      }

      if (currentValue.length < previousValue.length) {
        previousValue = currentValue;
        return;
      }

      const newText =
        currentValue.slice(previousValue.length);

      previousValue = currentValue;

      for (const char of newText) {
        addCharacter(char);
      }

      imeInput.value = "";
      previousValue = "";
    });

    imeInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();

        typedHistory.push({
          char: "\n",
          jamos: [],
          englishKeys: "\n",
          tileCount: 0
        });

        composedText += "\n";
        composedEnglishText += "\n";

        updateTypedOverlay();
        updateEnglishTypedOverlay();

        imeInput.value = "";
        previousValue = "";

        return;
      }

      if (event.key === "Tab") {
        event.preventDefault();

        toggleOverviewMode();

        imeInput.value = "";
        previousValue = "";

        return;
      }

      if (event.key === "Backspace") {
        event.preventDefault();

        removeLastTile();

        imeInput.value = "";
        previousValue = "";

        return;
      }

      if (event.key === "Escape") {
        event.preventDefault();

        clearAllTiles();

        imeInput.value = "";
        previousValue = "";
      }
    });

    window.addEventListener("resize", () => {
      if (resizeRaf) {
        cancelAnimationFrame(resizeRaf);
      }

      resizeRaf = requestAnimationFrame(() => {
        ensureBackgroundTrack();

        [...placedTiles].forEach(tile => {
          if (!tile.parentNode) return;

          const jamo = tile.dataset.jamo;
          const visual = tile.querySelector("img, .fallback");

          if (!visual) return;

          if (scatterJamos.has(jamo)) {
            placeScatterTile(tile, visual);
          }
        });

        updateWorldSize();

        const lastFlowTile = [...placedTiles]
          .reverse()
          .find(tile => !tile.classList.contains("scatter"));

        if (lastFlowTile) {
          lockViewToTile(lastFlowTile, false);
        } else {
          moveCameraTo(viewport.scrollLeft, true);
        }

        resizeRaf = null;
      });
    });

    updateTypedOverlay();
    updateEnglishTypedOverlay();
    updateWorldSize();
    ensureBackgroundTrack();
    moveCameraTo(0, true);
  </script>
</body>
</html>
